name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Гейт: в прод уезжает только то, что прошло типы, линт, юниты и браузерные
  # тесты. Раньше деплой проверял ровно одно — что сборка собралась, — и любая
  # сломанная логика выкатывалась молча. При красных тестах сборки не будет, а
  # на Pages останется прошлая рабочая версия.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Уведомление об обновлении — само, но только когда поднялась версия.
  #
  # Владельцу нужно узнавать о доехавшем релизе от приложения, а не ждать
  # словами от меня. Но выкаток за день бывает несколько, а версия меняется
  # только когда в changelog появилась новая запись — то есть когда человеку
  # реально есть что показать. Кто помнит, о какой версии уже рассылали, —
  # воркер (KV): скрипт шлёт версию вместе с текстом, повтор получает «пропуск».
  #
  # Текст берётся из того же changelog, что и окно «Что нового» внутри
  # приложения, — расходиться им негде.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # После каждого удачного деплоя, без сравнения с предыдущим коммитом:
      # помнит отправленную версию воркер, и на ту же версию отвечает
      # «пропуск». Сравнение HEAD~1 здесь ломалось, стоило деплою с новой
      # версией упасть на тестах: следующий, зелёный, видел «не менялась».
      - name: Разослать уведомление, если версия новая
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/notify-update.mjs
