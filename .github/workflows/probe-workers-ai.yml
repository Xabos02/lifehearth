name: Probe Workers AI (temporary)
# Временная проверка Workers AI через binding: tools + stream. Воркер
# lifehearth-ai-probe живёт только время прогона, ветка удаляется после.
on:
  push:
    branches: [probe/workers-ai]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Key
        run: |
          K=$(openssl rand -hex 24); echo "::add-mask::$K"; echo "PROBE_KEY=$K" >> "$GITHUB_ENV"
      - name: Deploy probe worker
        working-directory: .github/probe/worker
        run: npx --yes wrangler@4 deploy --var "PROBE_KEY:$PROBE_KEY"
      - name: Probe
        run: node .github/probe/probe.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_URL: https://lifehearth-ai-probe.xabos161rus.workers.dev
          PROBE_MODE: all
          MAX_TOKENS: '8192'
      - name: Delete probe worker
        if: always()
        working-directory: .github/probe/worker
        run: npx --yes wrangler@4 delete --force || npx --yes wrangler@4 delete --name lifehearth-ai-probe --force
