name: Probe Workers AI (temporary)
# Временная проверка учёта личного лимита: читает из D1 только строку тестового
# ключа (не чужие), ветка удаляется после.
on:
  push:
    branches: [probe/workers-ai]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read test row
        working-directory: worker
        run: |
          ACC=$(cat ../.github/probe/test-account.txt)
          npx --yes wrangler@4 d1 execute life-hub-sync --remote --json --command "SELECT n FROM ai_usage WHERE k LIKE '%:a:${ACC}'; SELECT COUNT(*) AS rows FROM ai_usage" 2>&1 | grep -v '"k"' | head -40 || true
