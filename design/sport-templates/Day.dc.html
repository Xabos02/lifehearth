<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вкладка «Спорт» — шаблоны в карточке дня</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.scr{--bg:#08080f;--sf:#18181f;--sf2:#22222d;--ac:#c9a84c;--tx:#f0eee8;--tx2:rgba(240,238,232,.52);--bd:rgba(255,255,255,.07);--bds:rgba(240,238,232,.15);--or:oklch(0.66 0.19 45)}
.scr.light{--bg:oklch(0.975 0.005 280);--sf:#fff;--sf2:oklch(0.955 0.006 282);--ac:oklch(0.495 0.0996 87.4);--tx:oklch(0.26 0.022 284);--tx2:oklch(0.52 0.022 282);--bd:oklch(0 0 0 / .07);--bds:oklch(0 0 0 / .14)}
.scr{width:375px;min-height:550px;background:var(--bg);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.45;color:var(--tx);-webkit-font-smoothing:antialiased;box-sizing:border-box;padding:17px;display:flex;flex-direction:column;gap:17px}
.scr *{box-sizing:border-box}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:17px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:24px}
.h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);padding-left:4px}
.plus{border:0;background:none;color:var(--ac);font:inherit;font-size:14.9px;font-weight:500;padding:0;min-height:24px}
.none{margin:0;padding-left:4px;font-size:14.9px;color:var(--tx2)}
.by{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.byh{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.byh span{font-size:14.9px;color:var(--tx2);padding-left:4px}
.all{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--ac);font:inherit;font-size:14.9px;font-weight:500;padding:0;min-height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:99px;border:1px solid var(--bds);background:var(--sf2);color:var(--tx);font:inherit;font-size:14.9px;font-weight:500;padding:8px 14px;min-height:40px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font:inherit;text-align:left;padding:10px 0;min-height:44px}
.row.l{border-bottom:0}
.dot{width:10px;height:10px;border-radius:99px;flex:none}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{display:block;font-size:12.75px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{flex:none;text-align:right;font-size:14.9px;font-variant-numeric:tabular-nums}
.r small{display:block;font-size:12.75px;color:var(--tx2)}
.chev{flex:none;color:var(--tx2)}
</style>
</helmet>
<div class="scr {{themeClass}}">

<div class="card">
<div class="top"><span class="h">Сегодня</span><button class="plus">+ Тренировка</button></div>
<p class="none">Тренировок не отмечено.</p>
<div class="by">
<div class="byh"><span>По шаблону</span><button class="all">Шаблоны<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div>
<div class="chips"><button class="chip">Тренировка А</button><button class="chip">Тренировка Б</button><button class="chip">Контрольный день</button></div>
</div>
</div>

<div class="card">
<div class="top"><span class="h">Недавние</span></div>
<button class="row"><span class="dot" style="background: var(--ac)"></span><span class="mid"><b>Бег</b><span>пт, 13 ноября · 6:00 /км · Дорожка</span></span><span class="r">12 мин<small>2,0 км</small></span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><span class="dot" style="background: var(--ac)"></span><span class="mid"><b>Силовая</b><span>пт, 13 ноября · Подтягивания с поясом 4×6–8, +12,5 кг · Брусья с поясом 4×8–10, +17,5 кг</span></span><span class="r">45 мин</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row l"><span class="dot" style="background: var(--or)"></span><span class="mid"><b>Бокс</b><span>пт, 13 ноября · Раунд 1 3 мин · Раунд 2 3 мин · Раунд 3 3 мин</span></span><span class="r">11 мин</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":375,"height":550}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.light ? 'light' : '' };
  }
}
</script>
</body>
</html>
