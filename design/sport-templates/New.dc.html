<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый шаблон — стало</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.scr{--bg:#08080f;--sf:#18181f;--sf2:#22222d;--ac:#c9a84c;--tx:#f0eee8;--tx2:rgba(240,238,232,.52);--bd:rgba(255,255,255,.07);--bds:rgba(240,238,232,.15);--dim:rgba(0,0,0,.6)}
.scr.light{--bg:oklch(0.975 0.005 280);--sf:#fff;--sf2:oklch(0.955 0.006 282);--ac:oklch(0.495 0.0996 87.4);--tx:oklch(0.26 0.022 284);--tx2:oklch(0.52 0.022 282);--bd:oklch(0 0 0 / .07);--bds:oklch(0 0 0 / .14);--dim:rgba(0,0,0,.35)}
.scr{width:375px;min-height:812px;background:var(--bg);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.45;color:var(--tx);-webkit-font-smoothing:antialiased;box-sizing:border-box;padding-top:40px;position:relative}
.scr *{box-sizing:border-box}
.dim{position:absolute;inset:0;background:var(--dim)}
.sheet{position:relative;background:var(--sf);border-top:1px solid var(--bds);border-radius:27px 27px 0 0;min-height:772px;padding:0 17px 28px}
.grab{margin:0 auto;width:36px;height:4px;border-radius:9px;background:var(--bds);position:relative;top:10px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 0 12px}
.hd h2{margin:0;font-size:19px;font-weight:600}
.x{width:32px;height:32px;border-radius:99px;border:0;background:var(--sf2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.fld{margin-top:16px}
.lbl{display:block;font-size:14.9px;font-weight:500;color:var(--tx2);margin:0 0 6px}
.inp{display:block;width:100%;min-height:49px;border-radius:14px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;padding:11px 14px}
.inp::placeholder{color:var(--tx2)}
.ph{color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font:inherit;font-size:14.9px;font-weight:500;padding:6px 14px;min-height:36px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.chip.rd{border-color:var(--bds);background:var(--sf2);color:var(--tx)}
.hint{margin:8px 0 0;font-size:12.75px;color:var(--tx2);line-height:1.35}
.card{border:1px solid var(--bds);border-radius:17px;padding:13px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.kh{display:flex;align-items:center;gap:8px;min-height:44px;margin:-8px 0 -4px}
.kn{display:flex;align-items:center;gap:9px;flex:1;min-width:0;min-height:44px;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:0;text-align:left}
.dot{width:10px;height:10px;border-radius:99px;flex:none}
.cv{color:var(--tx2);flex:none}
.add{border:1px dashed var(--bds);background:none;color:var(--ac);font:inherit;font-size:14.9px;font-weight:500;border-radius:99px;padding:8px 14px;min-height:38px;display:inline-flex;align-items:center;gap:4px}
.btn{width:100%;height:51px;border:0;border-radius:14px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;margin-top:22px;opacity:.4}
</style>
</helmet>
<div class="scr {{themeClass}}">
<div class="dim"></div>
<div class="sheet">
<div class="grab"></div>
<div class="hd"><h2>Новый шаблон</h2><button class="x" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

<label class="lbl" for="tn">Название шаблона</label>
<input id="tn" class="inp" placeholder="Например, «День ног»">

<div class="fld">
<label class="lbl" for="tm">Памятка</label>
<input id="tm" class="inp" placeholder="Правила, прогрессия — по желанию">
</div>

<div class="card">
<div class="kh"><button class="kn" aria-label="Вид: Силовая. Свернуть"><span class="dot" style="background: var(--ac)"></span>Силовая<svg class="cv" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button></div>
<div class="chips"><button class="chip">Бег</button><button class="chip on">Силовая</button><button class="chip">Бокс</button><button class="chip">Гири</button><button class="chip">Растяжка</button><button class="chip">Ходьба</button><button class="chip">Вело</button><button class="chip">Плавание</button><button class="chip">Другое</button><button class="chip">+ Своё</button></div>
<div><label class="lbl" for="m1">Минут</label><input id="m1" class="inp" placeholder="по желанию"></div>
<div><button class="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Упражнение</button></div>
</div>

<div style="margin-top: 16px"><button class="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить ещё вид</button></div>

<button class="btn">Сохранить</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.light ? 'light' : '' };
  }
}
</script>
</body>
</html>
