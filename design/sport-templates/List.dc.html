<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Список шаблонов — стало</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.scr{--bg:#08080f;--sf:#18181f;--sf2:#22222d;--ac:#c9a84c;--tx:#f0eee8;--tx2:rgba(240,238,232,.52);--bd:rgba(255,255,255,.07);--bds:rgba(240,238,232,.15);--dim:rgba(0,0,0,.6)}
.scr.light{--bg:oklch(0.975 0.005 280);--sf:#fff;--sf2:oklch(0.955 0.006 282);--ac:oklch(0.495 0.0996 87.4);--tx:oklch(0.26 0.022 284);--tx2:oklch(0.52 0.022 282);--bd:oklch(0 0 0 / .07);--bds:oklch(0 0 0 / .14);--dim:rgba(0,0,0,.35)}
.scr{width:375px;height:812px;background:var(--bg);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.45;color:var(--tx);-webkit-font-smoothing:antialiased;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.scr *{box-sizing:border-box}
.dim{position:absolute;inset:0;background:var(--dim)}
.sheet{position:relative;background:var(--sf);border-top:1px solid var(--bds);border-radius:27px 27px 0 0;padding:0 17px 30px}
.grab{margin:0 auto;width:36px;height:4px;border-radius:9px;background:var(--bds);position:relative;top:10px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
.hd h2{margin:0;font-size:19px;font-weight:600}
.x{width:32px;height:32px;border-radius:99px;border:0;background:var(--sf2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.hint{margin:0 0 12px;font-size:14.9px;color:var(--tx2);line-height:1.35}
.tpl{display:flex;align-items:center;gap:4px;border:1px solid var(--bds);border-radius:17px;padding:4px 4px 4px 13px;margin-top:8px}
.pick{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;text-align:left;padding:9px 0;min-height:44px}
.pick b{display:block;font-weight:500;line-height:1.3}
.pick span{display:block;margin-top:2px;font-size:14.9px;color:var(--tx2);line-height:1.35}
.edit{width:44px;height:44px;border:0;background:none;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex:none}
.new{margin-top:8px;width:100%;min-height:52px;border:1px dashed var(--bds);border-radius:17px;background:none;color:var(--ac);font:inherit;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
</helmet>
<div class="scr {{themeClass}}">
<div class="dim"></div>
<div class="sheet">
<div class="grab"></div>
<div class="hd"><h2>Шаблоны тренировок</h2><button class="x" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<p class="hint">Выберите шаблон — тренировка заполнится сама. Карандаш — изменить.</p>

<div class="tpl"><button class="pick"><b>Контрольный день</b><span>Силовая, Бег, Бокс, Плавание · 55 мин</span></button><button class="edit" aria-label="Изменить шаблон «Контрольный день»"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button></div>

<div class="tpl"><button class="pick"><b>Тренировка А — сила и удар</b><span>Бег, Силовая, Бокс · 68 мин</span></button><button class="edit" aria-label="Изменить шаблон «Тренировка А — сила и удар»"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button></div>

<div class="tpl"><button class="pick"><b>Тренировка Б — взрыв и серийность</b><span>Скакалка, Бокс, Силовая · 66 мин</span></button><button class="edit" aria-label="Изменить шаблон «Тренировка Б — взрыв и серийность»"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button></div>

<button class="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Новый шаблон</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.light ? 'light' : '' };
  }
}
</script>
</body>
</html>
