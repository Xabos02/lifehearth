<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шаблон — вариант Б, читается как программа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.scr{--bg:#08080f;--sf:#18181f;--sf2:#22222d;--ac:#c9a84c;--acb:rgba(201,168,76,.3);--tx:#f0eee8;--tx2:rgba(240,238,232,.52);--bd:rgba(255,255,255,.07);--bds:rgba(240,238,232,.15);--dim:rgba(0,0,0,.6);--dg:oklch(0.70 0.185 20);--or:oklch(0.66 0.19 45)}
.scr.light{--bg:oklch(0.975 0.005 280);--sf:#fff;--sf2:oklch(0.955 0.006 282);--ac:oklch(0.495 0.0996 87.4);--acb:oklch(0.495 0.0996 87.4 / .3);--tx:oklch(0.26 0.022 284);--tx2:oklch(0.52 0.022 282);--bd:oklch(0 0 0 / .07);--bds:oklch(0 0 0 / .14);--dim:rgba(0,0,0,.35);--dg:oklch(0.495 0.2 22)}
.scr{width:375px;min-height:2787px;background:var(--bg);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.45;color:var(--tx);-webkit-font-smoothing:antialiased;box-sizing:border-box;padding-top:40px;position:relative}
.scr *{box-sizing:border-box}
.dim{position:absolute;inset:0;background:var(--dim)}
.sheet{position:relative;background:var(--sf);border-top:1px solid var(--bds);border-radius:27px 27px 0 0;min-height:2747px;padding:0 17px 28px}
.grab{margin:0 auto;width:36px;height:4px;border-radius:9px;background:var(--bds);position:relative;top:10px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 0 12px}
.hd h2{margin:0;font-size:19px;font-weight:600}
.x{width:32px;height:32px;border-radius:99px;border:0;background:var(--sf2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.fld{margin-top:16px}
.lbl{display:block;font-size:14.9px;font-weight:500;color:var(--tx2);margin:0 0 6px}
.inp{display:block;width:100%;min-height:49px;border-radius:14px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;padding:11px 14px}
.card{border:1px solid var(--bds);border-radius:17px;padding:2px 13px 13px;margin-top:16px}
.kh{display:flex;align-items:center;gap:8px;min-height:50px}
.kn{display:flex;align-items:center;gap:9px;flex:1;min-width:0;min-height:44px;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:0;text-align:left}
.dot{width:10px;height:10px;border-radius:99px;flex:none}
.cv{color:var(--tx2);flex:none}
.km{margin-left:auto;color:var(--tx2);font-size:14.9px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{width:44px;height:44px;margin-right:-11px;border:0;background:none;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex:none}
.ex{display:block;width:100%;min-height:44px;border:0;border-top:1px solid var(--bd);background:none;color:var(--tx);font:inherit;text-align:left;padding:10px 0}
.l1{display:flex;align-items:baseline;gap:12px}
.nm{flex:1;min-width:0;font-weight:500;line-height:1.3}
.am{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb{display:block;margin-top:3px;font-size:14.9px;line-height:1.35}
.sb i{font-style:normal;color:var(--tx2)}
.nt{display:block;margin-top:3px;font-size:14.9px;line-height:1.4;color:var(--tx2)}
.ed{border:1px solid var(--acb);border-radius:14px;padding:12px;margin:4px 0 10px}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.col{display:flex;flex-direction:column;min-width:0}
.col.g{flex:1}
.sl{font-size:12.75px;color:var(--tx2);margin-bottom:5px}
.num{width:56px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;text-align:center;font-variant-numeric:tabular-nums;padding:0}
.op{height:44px;display:flex;align-items:center;color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font:inherit;font-size:14.9px;font-weight:500;padding:6px 14px;min-height:36px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.act{display:flex;align-items:center;gap:8px;margin-top:14px}
.sq{width:44px;height:44px;border-radius:12px;border:1px solid var(--bds);background:none;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex:none}
.tb{border:0;background:none;color:var(--tx2);font:inherit;font-size:14.9px;font-weight:500;min-height:44px;padding:0 8px}
.done{margin-left:auto;border:0;border-radius:12px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;min-height:44px;padding:0 18px}
.add{margin-top:10px;border:1px dashed var(--bds);background:none;color:var(--ac);font:inherit;font-size:14.9px;font-weight:500;border-radius:99px;padding:8px 14px;min-height:38px;display:inline-flex;align-items:center;gap:4px}
.foot{display:flex;gap:12px;margin-top:22px}
.del{flex:none;height:51px;padding:0 18px;border-radius:14px;border:1px solid var(--bds);background:none;color:var(--dg);font:inherit;font-weight:500}
.btn{flex:1;height:51px;border:0;border-radius:14px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600}
</style>
</helmet>
<div class="scr {{themeClass}}">
<div class="dim"></div>
<div class="sheet">
<div class="grab"></div>
<div class="hd"><h2>Шаблон</h2><button class="x" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

<label class="lbl" for="tn">Название шаблона</label>
<input id="tn" class="inp" value="Тренировка А — сила и удар">

<div class="fld">
<label class="lbl" for="tm">Памятка</label>
<div id="tm" class="inp">Запас 1–2 повтора до отказа. Остаётся 3–4 в последнем подходе — в следующий раз +2,5–5 кг. Разгрузка на 4-й и 8-й неделе: минус один рабочий подход.</div>
</div>

<div class="card">
<div class="kh"><button class="kn" aria-label="Вид: Бег. Изменить"><span class="dot" style="background: var(--ac)"></span>Бег<svg class="cv" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><span class="km">12 мин · 2 км</span></button><button class="ib" aria-label="Убрать вид"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<button class="ex"><span class="l1"><span class="nm">Дорожка</span></span><span class="nt">10,5–11,5 км/ч, уклон 1,5–2%</span></button>
<button class="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Упражнение</button>
</div>

<div class="card">
<div class="kh"><button class="kn" aria-label="Вид: Силовая. Изменить"><span class="dot" style="background: var(--ac)"></span>Силовая<svg class="cv" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><span class="km">45 мин</span></button><button class="ib" aria-label="Убрать вид"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

<button class="ex"><span class="l1"><span class="nm">Суставная разминка</span><span class="am">3–4 мин</span></span><span class="nt">Потом 10 отжиманий и 5 подтягиваний со своим весом</span></button>

<button class="ex"><span class="l1"><span class="nm">Подтягивания с поясом</span><span class="am">4 × 6–8</span></span><span class="sb">+10–15 кг <i>· отдых 2 мин</i></span><span class="nt">Разминка 1×5–6 со своим весом</span></button>

<div class="ed">
<label class="sl" for="en">Упражнение</label>
<input id="en" class="inp" value="Брусья с поясом">
<div class="row">
<div class="col"><label class="sl" for="es">Подходы</label><input id="es" class="num" value="4"></div>
<span class="op" aria-hidden="true">×</span>
<div class="col"><label class="sl" for="er">Повторы</label><input id="er" class="num" value="8"></div>
<span class="op" aria-hidden="true">–</span>
<div class="col"><label class="sl" for="et">до</label><input id="et" class="num" value="10"></div>
</div>
<div class="chips"><button class="chip on">повторы</button><button class="chip">сек</button><button class="chip">мин</button><button class="chip">м</button></div>
<div class="row">
<div class="col g"><label class="sl" for="ew">Вес</label><input id="ew" class="inp" value="+15–20 кг"></div>
<div class="col g"><label class="sl" for="eo">Отдых</label><input id="eo" class="inp" value="2 мин"></div>
</div>
<div class="fld" style="margin-top: 12px">
<label class="sl" for="ez" style="display: block">Заметка</label>
<div id="ez" class="inp">Разминка 1×8 со своим весом. Локти вдоль корпуса</div>
</div>
<div class="act">
<button class="sq" aria-label="Выше"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
<button class="sq" aria-label="Ниже"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></button>
<button class="tb">Убрать</button>
<button class="done">Готово</button>
</div>
</div>

<button class="ex"><span class="l1"><span class="nm">Тяга горизонтального блока</span><span class="am">3 × 10–12</span></span><span class="sb">45–55 кг <i>· отдых 90 сек</i></span><span class="nt">Узкая рукоять, пауза 1 сек у живота. Разминка 1×12 с 25–30 кг</span></button>

<button class="ex"><span class="l1"><span class="nm">Тяга трэп-грифа или румынка с гантелями</span><span class="am">3 × 8</span></span><span class="sb">60–70 кг, гантели по 22–26 <i>· отдых 2 мин</i></span><span class="nt">Разминка 1×10 с 35–40 кг</span></button>

<button class="ex"><span class="l1"><span class="nm">5А. Взрывные отжимания на кулаках</span><span class="am">3 × 15–20</span></span><span class="sb">свой вес</span><span class="nt">Суперсет: сразу после — 5Б, без отдыха</span></button>

<button class="ex"><span class="l1"><span class="nm">5Б. Face Pulls</span><span class="am">3 × 15</span></span><span class="sb">15–20 кг <i>· отдых 75 сек</i></span><span class="nt">Тяга каната ко лбу. Отдых — после круга 5А + 5Б</span></button>

<button class="ex"><span class="l1"><span class="nm">Изометрия на шею</span><span class="am">2 × 12–15 сек</span></span><span class="sb"><i>отдых 30 сек</i></span><span class="nt">В 4 стороны: лоб, затылок, оба виска. Давление рукой 40–50%</span></button>

<button class="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Упражнение</button>
</div>

<div class="card">
<div class="kh"><button class="kn" aria-label="Вид: Бокс. Изменить"><span class="dot" style="background: var(--or)"></span>Бокс<svg class="cv" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><span class="km">11 мин</span></button><button class="ib" aria-label="Убрать вид"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

<button class="ex"><span class="l1"><span class="nm">Раунд 1</span><span class="am">3 мин</span></span><span class="sb"><i>отдых 1 мин</i></span><span class="nt">Тяжёлый кожаный мешок. 1-я мин — джеб с шагом, сайд-степ, джеб на отходе. 2-я — сдвоенный джеб (голова — корпус) + уклон или шаг. 3-я — джеб + жёсткий правый прямой, пауза 1,5 сек</span></button>

<button class="ex"><span class="l1"><span class="nm">Раунд 2</span><span class="am">3 мин</span></span><span class="sb"><i>отдых 1 мин</i></span><span class="nt">1-я мин — тройка: джеб, кросс, левый хук — акцент на хук. 2-я — перевод по этажам: голова, солнечное сплетение, голова. 3-я — одиночные акценты: правый прямой, левый по печени</span></button>

<button class="ex"><span class="l1"><span class="nm">Раунд 3</span><span class="am">3 мин</span></span><span class="nt">1-я мин — 3 жёстких удара за 2 сек, 4 сек перемещения. 2-я — уклон влево + правый прямой + левый хук; нырок + правый апперкот + левый хук. 3-я — спурт двойками и тройками, последние 15 сек — максимальная частота</span></button>

<button class="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Упражнение</button>
</div>

<div><button class="add" style="margin-top: 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить ещё вид</button></div>

<div class="foot"><button class="del">Удалить</button><button class="btn">Сохранить</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":375,"height":2787}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.light ? 'light' : '' };
  }
}
</script>
</body>
</html>
