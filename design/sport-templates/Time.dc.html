<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шаблон — общее время барабаном</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.scr{--bg:#08080f;--sf:#18181f;--sf2:#22222d;--ac:#c9a84c;--acd:rgba(201,168,76,.15);--acb:rgba(201,168,76,.3);--tx:#f0eee8;--tx2:rgba(240,238,232,.52);--bd:rgba(255,255,255,.07);--bds:rgba(240,238,232,.15);--dim:rgba(0,0,0,.6)}
.scr.light{--bg:oklch(0.975 0.005 280);--sf:#fff;--sf2:oklch(0.955 0.006 282);--ac:oklch(0.495 0.0996 87.4);--acd:oklch(0.495 0.0996 87.4 / .12);--acb:oklch(0.495 0.0996 87.4 / .3);--tx:oklch(0.26 0.022 284);--tx2:oklch(0.52 0.022 282);--bd:oklch(0 0 0 / .07);--bds:oklch(0 0 0 / .14);--dim:rgba(0,0,0,.35)}
.scr{width:375px;min-height:500px;background:var(--bg);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.45;color:var(--tx);-webkit-font-smoothing:antialiased;box-sizing:border-box;padding-top:40px;position:relative}
.scr *{box-sizing:border-box}
.dim{position:absolute;inset:0;background:var(--dim)}
.sheet{position:relative;background:var(--sf);border-top:1px solid var(--bds);border-radius:27px 27px 0 0;min-height:460px;padding:0 17px 28px}
.grab{margin:0 auto;width:36px;height:4px;border-radius:9px;background:var(--bds);position:relative;top:10px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 0 12px}
.hd h2{margin:0;font-size:19px;font-weight:600}
.x{width:32px;height:32px;border-radius:99px;border:0;background:var(--sf2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.two{display:flex;gap:8px;align-items:flex-end}
.two .g{flex:1;min-width:0}
.two .t{flex:none;width:112px}
.lbl{display:block;font-size:14.9px;font-weight:500;color:var(--tx2);margin:0 0 6px}
.inp{display:block;width:100%;min-height:49px;border-radius:14px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;padding:11px 14px}
.time{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;border-radius:14px;border:1px solid var(--acb);background:var(--sf2);color:var(--tx);font:inherit;font-variant-numeric:tabular-nums;padding:0 8px;box-shadow:0 0 0 2px var(--acd)}
.wheel{position:relative;margin-top:10px;height:132px;border-radius:14px;border:1px solid var(--bd);background:var(--sf2);display:flex;justify-content:center;gap:16px;overflow:hidden}
.band{position:absolute;left:10px;right:10px;top:44px;height:44px;border-radius:12px;background:var(--acd);box-shadow:inset 0 0 0 1px var(--acb)}
.colw{position:relative;width:120px;display:flex;flex-direction:column}
.cell{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--tx2);font:inherit;font-size:19px;font-variant-numeric:tabular-nums;padding:0}
.cell.far{opacity:.75;transform:scale(.92)}
.cell.on{color:var(--ac);font-weight:700}
.cell.on small{color:var(--tx);font-weight:500}
.cell small{font-size:14.9px;visibility:hidden}
.cell.on small{visibility:visible}
.fld{margin-top:16px}
.ph{color:var(--tx2)}
</style>
</helmet>
<div class="scr {{themeClass}}">
<div class="dim"></div>
<div class="sheet">
<div class="grab"></div>
<div class="hd"><h2>Шаблон</h2><button class="x" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

<div class="two">
<div class="g"><label class="lbl" for="tn">Название шаблона</label><input id="tn" class="inp" value="Тренировка А"></div>
<div class="t"><span class="lbl">Время</span><button class="time" aria-expanded="true" aria-label="Общее время: 1 ч 10 м. Изменить">1 ч 10 м</button></div>
</div>

<div class="wheel" role="group" aria-label="Общее время тренировки">
<div class="band"></div>
<div class="colw">
<button class="cell far" tabindex="-1" aria-hidden="true">0<small>ч</small></button>
<button class="cell on" aria-pressed="true" aria-label="1 час, выбрано">1<small>ч</small></button>
<button class="cell far" tabindex="-1" aria-hidden="true">2<small>ч</small></button>
</div>
<div class="colw">
<button class="cell far" tabindex="-1" aria-hidden="true">05<small>мин</small></button>
<button class="cell on" aria-pressed="true" aria-label="10 минут, выбрано">10<small>мин</small></button>
<button class="cell far" tabindex="-1" aria-hidden="true">15<small>мин</small></button>
</div>
</div>

<div class="fld">
<label class="lbl" for="tm">Памятка</label>
<div id="tm" class="inp">Запас 1–2 повтора до отказа. Остаётся 3–4 в последнем подходе — в следующий раз +2,5–5 кг.</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":375,"height":500}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.light ? 'light' : '' };
  }
}
</script>
</body>
</html>
