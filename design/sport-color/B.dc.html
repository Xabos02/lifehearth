<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Б: кнопка в календаре</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    body{margin:0;font-family:Inter,-apple-system,system-ui,sans-serif}
    .cap{height:40px;box-sizing:border-box;margin:0;padding:16px 16px 0;font-size:12px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase}
    img{display:block;width:375px}
  </style>
</helmet>
<div style="width: 770px; display: flex; gap: 20px; background: #f6f6fa">
  <div style="width: 375px; background: #08080f; color: rgba(240,238,232,0.52)">
    <p class="cap">Тёмная · +0 px: слева от «Дни | Месяц»</p>
    <img src="shots/B-dark-top.webp" alt="Под месячной сеткой слева кнопка «● Цвет», в календаре зелёные точки">
    <p class="cap">Барабан дней — кнопка та же</p>
    <img src="shots/B-dark-wheel.webp" alt="Барабан дней с зелёными точками и кнопкой «Цвет»">
    <p class="cap">Тап по «Цвет» → шторка</p>
    <img src="shots/B-dark-sheet.webp" alt="Шторка «Цвет отметки» с пятью кружками">
  </div>
  <div style="width: 375px; background: #f6f6fa; color: #6e6e7a">
    <p class="cap">Светлая</p>
    <img src="shots/B-light-top.webp" alt="То же в светлой теме">
    <p class="cap">Барабан дней</p>
    <img src="shots/B-light-wheel.webp" alt="Барабан в светлой теме">
    <p class="cap">Тап по «Цвет» → шторка</p>
    <img src="shots/B-light-sheet.webp" alt="Шторка в светлой теме">
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":770,"height":1876}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
