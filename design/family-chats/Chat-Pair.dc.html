<!doctype html>

<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
.screen{--bg:#08080f;--surface:#18181f;--surface2:#22222d;--accent:#c9a84c;--accentDim:rgba(201,168,76,.15);--text:#f0eee8;--muted:rgba(240,238,232,.52);--border:rgba(240,238,232,.08);--borderStrong:rgba(240,238,232,.15);--onAccent:#08080f;--success:oklch(0.72 0.17 158);
  width:375px;height:812px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left}
svg{display:block;flex:none}
.bar{display:flex;align-items:center;gap:8px;padding:44px 12px 8px 8px;border-bottom:1px solid var(--border);background:var(--bg)}
.back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:999px;background:var(--accentDim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;flex:none}
.nm{display:flex;flex-direction:column;min-width:0}
.n{font-size:17px;line-height:1.2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.3;font-weight:500;color:var(--muted)}
.on{width:7px;height:7px;border-radius:999px;background:var(--success)}
.acts{display:flex;align-items:center;gap:12px}
.ib{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--muted)}
.call{width:40px;height:40px;border-radius:999px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center}
.feed{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.day{align-self:center;margin:6px 0 8px;padding:3px 12px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:500}
.b{max-width:78%;padding:8px 12px 6px;border-radius:20px;font-size:17px;line-height:1.35;box-sizing:border-box}
.in{align-self:flex-start;background:var(--surface2);color:var(--text)}
.out{align-self:flex-end;background:var(--accent);color:var(--onAccent)}
.t{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px;font-size:13px;line-height:1.2;font-variant-numeric:tabular-nums}
.in .t{color:var(--muted)}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 12px 28px;border-top:1px solid var(--border)}
.att{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.field{flex:1;display:flex;align-items:center;min-height:44px;padding:0 6px 0 16px;border:1px solid var(--borderStrong);border-radius:24px;background:var(--surface);color:var(--muted);font-size:16px}
.field span{flex:1}
.mic{width:36px;height:36px;margin:4px 0;border-radius:999px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="screen">
  <div class="bar">
    <button class="back" aria-label="Назад к чатам"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 5.6 8 12l6.4 6.4"></path></svg></button>
    <button class="who" aria-label="Мама — о контакте">
      <span class="av">М</span>
      <span class="nm"><span class="n">Мама</span><span class="s"><span class="on"></span>в сети</span></span>
    </button>
    <div class="acts">
      <button class="ib" aria-label="Искать в переписке"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.4" cy="10.4" r="6.2" fill="currentColor" fill-opacity="0.25"></circle><circle cx="10.4" cy="10.4" r="6.2"></circle><path d="M14.78 14.78 19.8 19.8"></path></svg></button>
      <button class="call" aria-label="Позвонить: Мама"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 3.8 9.8 8.1 8 10.3a12.6 12.6 0 0 0 5.8 5.8L16 14.3l4.2 2.4v2.8a1.4 1.4 0 0 1-1.6 1.4C10.6 20.1 3.7 13.2 3.2 5.3A1.4 1.4 0 0 1 4.6 3.8z"></path></svg></button>
    </div>
  </div>

  <div class="feed">
    <span class="day">Сегодня</span>
    <div class="b in">Привет! Ты сегодня в смену?<div class="t">18:30</div></div>
    <div class="b out">Да, до утра. Завтра заеду<div class="t">18:35 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12.6 6.6 16.7 15 8"></path><path d="M10.5 15.6 11.6 16.7 20 8"></path></svg></div></div>
    <div class="b in">Хорошо. Возьми ключи от дачи<div class="t">18:40</div></div>
    <div class="b in">Как ты сегодня?<div class="t">18:42</div></div>
  </div>

  <div class="composer">
    <button class="att" aria-label="Прикрепить фото или файл"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.45 12.5V8.55a5.55 5.55 0 0 1 11.1 0v7.75a3.7 3.7 0 0 1-7.4 0V9.5a1.85 1.85 0 0 1 3.7 0v6.5"></path></svg></button>
    <div class="field"><span>Сообщение…</span><button class="mic" aria-label="Записать голосовое"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button></div>
  </div>
</div>
</x-dc>
