.screen{--bg:oklch(0.975 0.005 280);--surface:oklch(1 0 0);--surface2:oklch(0.955 0.006 282);--accent:oklch(0.495 0.0996 87.4);--accentDim:oklch(0.495 0.0996 87.4 / 0.12);--text:oklch(0.26 0.022 284);--muted:oklch(0.52 0.022 282);--border:oklch(0 0 0 / 0.07);--onAccent:oklch(0.975 0.005 280);--shadowCard:0 1px 2px oklch(0 0 0 / .06),0 8px 24px -12px oklch(0 0 0 / .14);--shadowAccent:0 10px 30px -8px oklch(0.495 0.0996 87.4 / .45);

svg{display:block;flex:none}
.head{display:flex;align-items:center;gap:8px;padding:52px 16px 12px}
.title{margin:0;flex:1;font-size:28px;font-weight:200;line-height:1.15;letter-spacing:-0.5px}
.icons{display:flex;gap:16px}
.ib{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--muted)}
.list{display:flex;flex-direction:column;padding-top:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:0 16px;box-sizing:border-box;position:relative}
.row + .row::before{content:'';position:absolute;top:0;left:72px;right:0;height:1px;background:var(--border)}
.av{width:44px;height:44px;border-radius:999px;background:var(--accentDim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;flex:none}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.line{display:flex;align-items:baseline;gap:8px}
.name{flex:1;min-width:0;font-size:17px;line-height:1.25;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:13px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums}
.time.new{color:var(--accent);font-weight:500}
.prev{flex:1;min-width:0;font-size:15px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.who{color:var(--text)}
.badge{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--onAccent);font-size:12px;font-weight:700;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.tasks{display:flex;align-items:center;gap:12px;margin:20px 16px 0;padding:0 16px;min-height:60px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadowCard)}
.tasks .tt{flex:1;font-size:17px;font-weight:500}
.tasks .tc{font-size:15px;color:var(--muted)}
.tasks .ac{color:var(--accent)}
.fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:999px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadowAccent)}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;padding:0 4px 8px;background:var(--surface);border-top:1px solid var(--border)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px;color:var(--muted);font-size:11px;font-weight:500;line-height:1.2}
.tab.on{color:var(--accent)}
.dot{position:absolute;top:-2px;right:-4px;width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
</style>
