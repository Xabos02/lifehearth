<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка группы «Наши»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
.screen{--bg:#08080f;--surface:#18181f;--surface2:#22222d;--accent:#c9a84c;--accentDim:rgba(201,168,76,.15);--accentBorder:rgba(201,168,76,.3);--text:#f0eee8;--muted:rgba(240,238,232,.52);--border:rgba(240,238,232,.08);--onAccent:#08080f;--danger:oklch(0.70 0.185 20);--success:oklch(0.80 0.16 158);--shadowCard:0 1px 2px oklch(0 0 0 / .4),0 8px 24px -12px oklch(0 0 0 / .55);
  width:375px;height:812px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left}
svg{display:block;flex:none}
.bar{display:flex;align-items:center;gap:4px;padding:44px 12px 4px 8px}
.back{display:flex;align-items:center;gap:2px;min-height:36px;padding-right:8px;color:var(--accent);font-size:17px;font-weight:500}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 16px 16px}
.big{width:72px;height:72px;border-radius:999px;background:var(--accentDim);color:var(--accent);display:flex;align-items:center;justify-content:center}
.gn{margin:6px 0 0;font-size:20px;line-height:1.25;font-weight:600}
.gs{font-size:15px;color:var(--muted)}
.pills{display:flex;gap:8px;margin-top:10px}
.pill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--accentBorder);color:var(--accent);font-size:15px;font-weight:600;box-sizing:border-box}
.cap{margin:12px 16px 6px;padding:0 4px;font-size:15px;font-weight:600;color:var(--muted)}
.card{margin:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadowCard);overflow:hidden}
.m{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 8px 0 14px}
.m + .m{border-top:1px solid var(--border)}
.av{position:relative;width:36px;height:36px;border-radius:999px;background:var(--accentDim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;flex:none}
.pd{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:999px;background:var(--success);box-shadow:0 0 0 2px var(--surface)}
.mb{flex:1;min-width:0;display:flex;flex-direction:column}
.mn{font-size:17px;line-height:1.25;font-weight:500}
.ms{font-size:13px;line-height:1.3;color:var(--muted)}
.ib{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--muted)}
.ib.go{color:var(--accent)}
.r{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;font-size:17px}
.r + .r{border-top:1px solid var(--border)}
.r .rt{flex:1}
.danger{color:var(--danger)}
</style>
</helmet>
<div class="screen">
  <div class="bar">
    <button class="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 5.6 8 12l6.4 6.4"></path></svg>Наши</button>
  </div>

  <div class="hero">
    <span class="big"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.6" cy="6.4" r="3" fill="currentColor" fill-opacity="0.25"></circle><circle cx="8.6" cy="6.4" r="3"></circle><path d="M2.9 18.9a5.7 5.7 0 0 1 11.4 0"></path><circle cx="18" cy="8.2" r="2.3"></circle><path d="M13.89 16.78a3.9 3.9 0 0 1 7.11 2.22"></path></svg></span>
    <h1 class="gn">Наши</h1>
    <span class="gs">4 участника · 1 в сети</span>
    <div class="pills">
      <button class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.8v14.4M4.8 12h14.4"></path></svg>Пригласить</button>
      <button class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.4 6.4 5.2 8.2l3.2-3.4"></path><path d="M3.4 17.6 5.2 19.4l3.2-3.4"></path><path d="M12.2 6.4h8.4M12.2 17.6h8.4"></path></svg>Задачи · 3</button>
    </div>
  </div>

  <h2 class="cap">Участники</h2>
  <div class="card">
    <div class="m">
      <span class="av">В</span>
      <button class="mb"><span class="mn">Влад · вы</span><span class="ms">Изменить своё имя</span></button>
    </div>
    <div class="m">
      <span class="av">М<span class="pd"></span></span>
      <span class="mb"><span class="mn">Мама</span><span class="ms">в сети</span></span>
      <button class="ib" aria-label="Исключить Мама"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7.5" r="3.5"></circle><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0M16 11h5"></path></svg></button>
      <button class="ib go" aria-label="Позвонить Мама"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 3.8 9.8 8.1 8 10.3a12.6 12.6 0 0 0 5.8 5.8L16 14.3l4.2 2.4v2.8a1.4 1.4 0 0 1-1.6 1.4C10.6 20.1 3.7 13.2 3.2 5.3A1.4 1.4 0 0 1 4.6 3.8z"></path></svg></button>
    </div>
    <div class="m">
      <span class="av">П</span>
      <span class="mb"><span class="mn">Папа</span><span class="ms">был в сети вчера</span></span>
      <button class="ib" aria-label="Исключить Папа"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7.5" r="3.5"></circle><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0M16 11h5"></path></svg></button>
      <button class="ib go" aria-label="Позвонить Папа"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 3.8 9.8 8.1 8 10.3a12.6 12.6 0 0 0 5.8 5.8L16 14.3l4.2 2.4v2.8a1.4 1.4 0 0 1-1.6 1.4C10.6 20.1 3.7 13.2 3.2 5.3A1.4 1.4 0 0 1 4.6 3.8z"></path></svg></button>
    </div>
    <div class="m">
      <span class="av">А</span>
      <span class="mb"><span class="mn">Аня</span><span class="ms">была в сети в 12:05</span></span>
      <button class="ib" aria-label="Исключить Аня"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7.5" r="3.5"></circle><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0M16 11h5"></path></svg></button>
      <button class="ib go" aria-label="Позвонить Аня"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 3.8 9.8 8.1 8 10.3a12.6 12.6 0 0 0 5.8 5.8L16 14.3l4.2 2.4v2.8a1.4 1.4 0 0 1-1.6 1.4C10.6 20.1 3.7 13.2 3.2 5.3A1.4 1.4 0 0 1 4.6 3.8z"></path></svg></button>
    </div>
  </div>

  <h2 class="cap">Группа</h2>
  <div class="card">
    <button class="r"><span class="rt">Переименовать группу</span></button>
    <button class="r"><span class="rt">Почему звонок не вышел</span></button>
    <button class="r danger"><span class="rt">Выйти из группы</span></button>
    <button class="r danger"><span class="rt">Удалить группу</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
