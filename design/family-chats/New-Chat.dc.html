<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый чат</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
.screen{--bg:#08080f;--surface:#18181f;--surface2:#22222d;--accent:#c9a84c;--accentDim:rgba(201,168,76,.15);--text:#f0eee8;--muted:rgba(240,238,232,.52);--border:rgba(240,238,232,.08);--borderStrong:rgba(240,238,232,.15);--onAccent:#08080f;
  width:375px;height:812px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left}
svg{display:block;flex:none}
.under{padding:52px 16px 0;opacity:.35}
.under .t{margin:0;font-size:28px;font-weight:200;letter-spacing:-0.5px}
.scrim{position:absolute;inset:0;background:oklch(0 0 0 / 0.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:196px;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:8px 0 24px}
.grab{align-self:center;width:36px;height:5px;border-radius:999px;background:var(--borderStrong);margin-bottom:12px}
.top{display:flex;align-items:center;padding:0 16px 8px}
.h{margin:0;flex:1;font-size:20px;line-height:1.25;font-weight:600}
.x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--surface2);color:var(--muted)}
.cap{margin:12px 16px 4px;padding:0 4px;font-size:15px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 16px;box-sizing:border-box;position:relative}
.row + .row::before{content:'';position:absolute;top:0;left:68px;right:0;height:1px;background:var(--border)}
.av{width:40px;height:40px;border-radius:999px;background:var(--accentDim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;flex:none}
.ring{background:transparent;border:1.5px solid var(--borderStrong);box-sizing:border-box}
.b{flex:1;min-width:0;display:flex;flex-direction:column}
.n{font-size:17px;line-height:1.25;font-weight:500}
.s{font-size:13px;line-height:1.3;color:var(--muted)}
.go{color:var(--accent);font-weight:600}
.hint{margin:16px 20px 0;font-size:13px;line-height:1.45;color:var(--muted)}
</style>
</helmet>
<div class="screen">
  <div class="under"><h1 class="t">Семья</h1></div>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Новый чат">
    <span class="grab"></span>
    <div class="top">
      <h2 class="h">Новый чат</h2>
      <button class="x" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6"></path></svg></button>
    </div>

    <h3 class="cap">Личный чат</h3>
    <button class="row">
      <span class="av">Б</span>
      <span class="b"><span class="n">Бабушка</span><span class="s">из группы «Наши»</span></span>
      <span class="go">Начать</span>
    </button>
    <button class="row">
      <span class="av">М</span>
      <span class="b"><span class="n">Мама</span><span class="s">чат уже есть</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: rgba(240,238,232,.52)"><path d="M9.6 5.6 16 12l-6.4 6.4"></path></svg>
    </button>

    <h3 class="cap">Ещё</h3>
    <button class="row">
      <span class="av ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.6" cy="6.4" r="3"></circle><path d="M2.9 18.9a5.7 5.7 0 0 1 11.4 0"></path><circle cx="18" cy="8.2" r="2.3"></circle><path d="M13.89 16.78a3.9 3.9 0 0 1 7.11 2.22"></path></svg></span>
      <span class="b"><span class="n">Новая группа</span><span class="s">Название, потом приглашение</span></span>
    </button>
    <button class="row">
      <span class="av ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.2"></rect><rect x="14" y="4" width="6" height="6" rx="1.2"></rect><rect x="4" y="14" width="6" height="6" rx="1.2"></rect><path d="M14 14h2v2M20 14v6h-6"></path></svg></span>
      <span class="b"><span class="n">Войти по приглашению</span><span class="s">QR или код и кодовое слово</span></span>
    </button>

    <p class="hint">Личный чат — отдельная группа на двоих со своим ключом: сообщения видите только вы двое. Чтобы его открыть, человек один раз сканирует ваш QR и вводит кодовое слово — так же, как при входе в семью.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
